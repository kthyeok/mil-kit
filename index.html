<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="description" content="군 생활 이벤트로 조건을 모아 실제 채용공고와 국가자격 코스를 찾아주는 Mil-Kit">
<meta property="og:title" content="Mil-Kit · 당신의 군생활을 요리해 드립니다">
<meta property="og:description" content="이병부터 병장까지, 내 군생활로 맞춤 채용공고와 자격증 코스를 요리해 보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kthyeok.github.io/mil-kit/">
<meta property="og:image" content="https://kthyeok.github.io/mil-kit/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- 카카오톡 공유 카드: Kakao Developers 앱의 JavaScript 키를 content 에 넣으세요 (비우면 휴대폰 공유창으로 보냄) -->
<meta name="kakao-js-key" content="">
<title>Mil-Kit · 당신의 군생활을 요리해 드립니다</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script src="data.js"></script>
<style>

:root{
  --blue:#3182F6; --blue-d:#1B64DA; --blue-bg:#E8F3FF;
  --g900:#191F28; --g800:#333D4B; --g700:#4E5968; --g600:#6B7684;
  --g500:#8B95A1; --g400:#B0B8C1; --g300:#D1D6DB; --g200:#E5E8EB;
  --g100:#F2F4F6; --g50:#F9FAFB;
  --red:#F04452; --green:#15C47E; --yellow:#FFB020; --purple:#8B5CF6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--g100);color:var(--g900);
  font:16px/1.5 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  letter-spacing:-0.3px;overscroll-behavior:none;
}
button{font-family:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
input,select,textarea{font-family:inherit;letter-spacing:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

.app{max-width:430px;margin:0 auto;background:#fff;height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.app.gray{background:var(--g100)}
@media(min-width:431px){.app{box-shadow:0 0 0 1px var(--g200),0 20px 60px -20px rgba(0,0,0,.15)}}

/* ── 상단바 ── */
.topbar{padding:var(--sat) 0 0;flex:0 0 auto;background:inherit;z-index:10}
.app.gray .topbar{background:var(--g100)}
.topbar .row{height:50px;display:flex;align-items:center;padding:0 8px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-size:22px;color:var(--g800);transition:background .15s;flex:0 0 44px}
.iconbtn:active{background:var(--g200)}
.iconbtn[hidden]{display:none}
.tb-title{font-size:15px;font-weight:700;color:var(--g800);margin-left:4px;display:flex;align-items:center;gap:7px}
.tb-right{margin-left:auto;padding-right:10px;display:flex;align-items:center;gap:6px}
.demo{font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 7px;border-radius:6px;
  background:#FFF4E0;color:#B8730A;border:1px solid #FFE2B0}
.tb-step{font-size:13px;font-weight:600;color:var(--g400)}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--g100);color:var(--g700)}
.app.gray .pill{background:#fff}
.pill:active{transform:scale(.96)}
.prog{height:3px;background:var(--g100)}
.prog i{display:block;height:100%;width:0;background:var(--blue);border-radius:0 3px 3px 0;
  transition:width .5s cubic-bezier(.22,1,.36,1)}
.prog[hidden]{display:none}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:6px 22px 12px;display:flex;flex-direction:column}
main::-webkit-scrollbar{width:0}
main.flush{padding:0}
main.hub{padding:4px 16px 10px}

.cta{flex:0 0 auto;padding:10px 20px calc(12px + var(--sab));background:#fff;box-shadow:0 -1px 0 var(--g100)}
.cta:empty{display:none}
.btn{width:100%;height:54px;border-radius:14px;background:var(--blue);color:#fff;
  font-size:17px;font-weight:700;transition:transform .1s,background .15s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:scale(.975);background:var(--blue-d)}
.btn:disabled{background:var(--g200);color:var(--g400);cursor:default}
.btn.sub{background:var(--g100);color:var(--g700)}
.btn.sub:active{background:var(--g200)}
.btn.sm{height:44px;font-size:14.5px;border-radius:12px}
.btn.dark{background:var(--g900)}
.btn-row{display:flex;gap:8px}

.h1{font-size:25px;font-weight:800;line-height:1.36;letter-spacing:-0.8px;margin:8px 0 0}
.h1 em{font-style:normal;color:var(--blue)}
.sub{font-size:14.5px;color:var(--g500);margin:8px 0 0;line-height:1.5}
.sec{font-size:13px;font-weight:700;color:var(--g500);margin:16px 0 8px;
  display:flex;align-items:center;gap:6px}
.sec .src{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--g400);
  background:var(--g50);padding:3px 7px;border-radius:6px;letter-spacing:-0.2px}
.grow{flex:1;min-height:0}
.fine{font-size:11px;color:var(--g400);line-height:1.5;margin-top:8px}

.up{animation:up .45s cubic-bezier(.22,1,.36,1) backwards;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 선택지 ── */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;
  background:var(--g50);border:1.5px solid transparent;text-align:left;width:100%;
  transition:transform .12s,background .15s,border-color .15s;position:relative}
.opt:active{transform:scale(.985)}
.opt.on{background:var(--blue-bg);border-color:var(--blue)}
.opt .em{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:#fff;
  display:grid;place-items:center;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.opt .tx{flex:1;min-width:0}
.opt .tt{display:block;font-size:15.5px;font-weight:700;letter-spacing:-0.4px;line-height:1.35}
.opt .tt .code{font-size:10.5px;font-weight:700;color:var(--g400);margin-left:4px}
.opt .dd{display:block;font-size:12.5px;color:var(--g500);margin-top:2px;line-height:1.4}
.opt .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.opt .tags b{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;
  background:#fff;color:var(--g600);border:1px solid var(--g200)}
.opt .ck{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--g300);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;transition:.15s}
.opt.on .ck{background:var(--blue);border-color:var(--blue)}
/* 세로형 카드 선택지 (2열) */
.opt.v{flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 11px;min-height:0}
.opt.v .ck{position:absolute;right:10px;top:10px}
.opt.v .tt{font-size:14.5px;padding-right:22px}
.opt.v .dd{font-size:11.5px;margin-top:0}
.opt.v .tags{margin-top:2px}
.opt.f{padding:14px 12px;flex-direction:column;align-items:flex-start;gap:8px}
.opt.f .em{width:44px;height:44px;font-size:23px}
.opt.f .ck{position:absolute;right:12px;top:12px}

.stage{background:linear-gradient(180deg,#EFF6FF 0%,#F7FAFF 100%);
  border-radius:24px;display:grid;place-items:center;padding:10px 0 4px;position:relative;overflow:hidden}
.stage::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(49,130,246,.13),transparent 68%)}
canvas{display:block;image-rendering:pixelated;position:relative}

.minirow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:18px;
  background:var(--g50);margin-top:12px}
.minirow .mc{width:48px;height:58px;flex:0 0 48px;display:grid;place-items:end center;
  background:var(--blue-bg);border-radius:13px;overflow:hidden}
.minirow .info .r{font-size:16px;font-weight:800;letter-spacing:-0.4px}
.minirow .info .m{font-size:12px;color:var(--g500);margin-top:1px}
.minirow .gear{margin-left:auto;text-align:right}
.minirow .gear b{display:block;font-size:16px;font-weight:800;color:var(--blue)}
.minirow .gear span{font-size:11px;color:var(--g500)}

/* ── 진급 ── */
.celebrate{text-align:center}
.badge-up{display:inline-block;padding:5px 13px;border-radius:999px;background:var(--blue-bg);
  color:var(--blue);font-size:12.5px;font-weight:700}
.rankbig{font-size:30px;font-weight:800;letter-spacing:-1.1px;margin:8px 0 2px}
.rankbig em{font-style:normal;color:var(--blue)}
.deltas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.deltas b{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;
  background:var(--g50);color:var(--g700)}
.deltas b i{font-style:normal;color:var(--blue)}
.gainrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.gainrow b{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:11px;background:#FFF7E6;color:#A8650A}

.stats{display:flex;flex-direction:column;gap:9px}
.st{display:flex;align-items:center;gap:10px}
.st .n{font-size:13px;font-weight:600;color:var(--g700);width:52px;flex:0 0 52px}
.st .bar{flex:1;height:8px;border-radius:5px;background:var(--g100);overflow:hidden}
.st .bar i{display:block;height:100%;width:0;border-radius:5px;
  transition:width .9s cubic-bezier(.22,1,.36,1);transition-delay:var(--d,0ms)}
.st .v{width:28px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.stats.tight{gap:6px}
.stats.tight .st .bar{height:6px}

/* ── 입력 ── */
.writebtn{width:100%;padding:12px 14px;border-radius:14px;background:var(--g50);margin-top:8px;
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--g600)}
.writebtn:active{background:var(--g100)}
.writebtn b{margin-left:auto;color:var(--blue);font-size:12px}
textarea{width:100%;min-height:96px;padding:14px;border-radius:14px;resize:none;
  background:var(--g50);border:1.5px solid var(--g200);font:15px/1.55 inherit;
  color:var(--g900);outline:none;letter-spacing:-0.3px}
textarea:focus{border-color:var(--blue);background:#fff}
textarea::placeholder{color:var(--g400)}
.detected{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:10px}
.detected b{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;
  background:var(--blue-bg);color:var(--blue);animation:pop .4s backwards;display:inline-flex;gap:5px;align-items:center}
.detected b.neg{background:#FFF0F1;color:#C9384A;text-decoration:line-through}
.detected b button{font-size:12px;color:inherit;opacity:.6}
.inp{width:100%;height:52px;padding:0 16px;border-radius:14px;
  background:var(--g50);border:1.5px solid var(--g200);font-size:16px;font-weight:700;
  color:var(--g900);outline:none;letter-spacing:-0.4px}
.inp:focus{border-color:var(--blue);background:#fff}
.inp::placeholder{color:var(--g400);font-weight:500}
input[type=date].inp{font-size:15px}

/* ── MBTI ── */
.axis{margin-top:10px;padding:11px 13px;border-radius:16px;background:var(--g50)}
.axis .q{font-size:12.5px;font-weight:700;color:var(--g600);margin-bottom:8px}
.seg2{display:flex;gap:8px}
.seg2 button{flex:1;padding:9px 6px;border-radius:12px;background:#fff;border:1.5px solid var(--g200);
  transition:.15s;text-align:center}
.seg2 button:active{transform:scale(.97)}
.seg2 button.on{background:var(--blue-bg);border-color:var(--blue)}
.seg2 button b{display:block;font-size:18px;font-weight:800;color:var(--g400);line-height:1.2}
.seg2 button.on b{color:var(--blue)}
.seg2 button span{display:block;font-size:11px;color:var(--g500);margin-top:1px}
.seg2 button.on span{color:var(--blue)}
.mbtibig{text-align:center;margin-top:12px;font-size:32px;font-weight:800;letter-spacing:2px;
  color:var(--blue);min-height:40px}
.mbtibig.dim{color:var(--g300);font-size:15px;letter-spacing:0;padding-top:10px}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button,.chip{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;
  background:var(--g50);color:var(--g700);border:1.5px solid transparent;white-space:nowrap}
.quick button.on,.chip.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.chip:active{transform:scale(.96)}

/* ── 홈 (Mil-Kit + 토스) ── */
.home{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
.brand h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-1.2px}
.brand h1 em{font-style:normal;color:var(--blue)}
.brand p{margin:3px 0 0;font-size:13px;color:var(--g500)}
.tcard{background:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.tcard.blue{background:linear-gradient(150deg,#3182F6,#1B64DA);color:#fff}
.tcard .lb{font-size:12.5px;font-weight:700;color:var(--g500)}
.tcard.blue .lb{color:rgba(255,255,255,.8)}
.cheer{display:flex;gap:12px;align-items:center}
.cheer .ctx{flex:1;min-width:0}
.cheer .l1{font-size:17px;font-weight:800;letter-spacing:-0.5px;line-height:1.35;margin-top:4px}
.cheer .l2{font-size:12.5px;opacity:.85;margin-top:3px}
.cheer .more{margin-top:9px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.2);color:#fff}
.pilseung{position:absolute;right:14px;top:12px;font-size:11px;font-weight:900;padding:4px 8px;border-radius:8px;
  background:#FFE55C;color:#5A4A00;transform:rotate(6deg)}
.dog{display:flex;align-items:center;gap:14px}
.dogtag{flex:0 0 118px;height:74px;border-radius:14px 14px 30px 30px/14px 14px 22px 22px;
  background:linear-gradient(145deg,#E9EDF2,#B8C1CC);box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.dogtag::before{content:'';position:absolute;top:7px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.dogtag small{font-size:10px;font-weight:800;color:#5A6472;margin-top:6px}
.dogtag b{font-size:25px;font-weight:900;color:#2B333D;letter-spacing:-0.5px;text-shadow:0 1px 0 #fff;font-variant-numeric:tabular-nums}
.dog .dx{flex:1;min-width:0}
.dog .dx .t{font-size:14px;font-weight:700;color:var(--g800)}
.dog .dx input{margin-top:6px;height:40px;font-size:14px;border-radius:11px;padding:0 10px}
.guides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide{padding:12px;border-radius:16px;background:var(--g50);border:1.5px solid transparent;text-align:left;display:flex;gap:9px;align-items:center}
.guide.on{border-color:var(--blue);background:var(--blue-bg)}
.guide .gtx{min-width:0}
.guide .gtx b{display:block;font-size:14px}
.guide .gtx span{display:block;font-size:11px;color:var(--g500);line-height:1.35;margin-top:1px}
.patch{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;font-weight:900;color:#fff}
.patch.green{background:linear-gradient(145deg,#5C7A3E,#3E5528)}
.patch.navy{background:linear-gradient(145deg,#34507E,#1F3357)}
.patch.sm{width:28px;height:28px;flex:0 0 28px;border-radius:9px;font-size:12px}
.homeacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hbtn{background:#fff;border-radius:18px;padding:13px 14px;text-align:left}
.hbtn:active{transform:scale(.98)}
.hbtn i{font-style:normal;font-size:20px}
.hbtn b{display:block;font-size:14px;margin-top:4px}
.hbtn span{display:block;font-size:11.5px;color:var(--g500)}
.mocknote{font-size:11px;color:#8A5A08;background:#FFFAF0;border:1px solid #FFE2B0;border-radius:11px;padding:7px 10px;line-height:1.45}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g500);white-space:nowrap;flex:0 0 auto}
.sw{width:40px;height:24px;border-radius:12px;background:var(--g300);position:relative;transition:.2s;flex:0 0 40px}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}
.sw.on::after{left:19px}

/* ── 선배 대화 ── */
.chatlog{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 12px;display:flex;flex-direction:column;gap:8px}
.chatlog::-webkit-scrollbar{width:0}
.msg{display:flex;gap:8px;align-items:flex-end;animation:up .35s backwards}
.msg .bub{max-width:78%;padding:10px 13px;border-radius:18px 18px 18px 6px;background:var(--g100);font-size:14.5px;line-height:1.5;white-space:pre-line}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--blue);color:#fff;border-radius:18px 18px 6px 18px;cursor:pointer}
.msg.me .bub:active{opacity:.8}
.msg .sp{width:28px;flex:0 0 28px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g400);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.composer{display:flex;flex-direction:column;gap:8px}
.composer .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto}
.composer .foot{display:flex;align-items:center;gap:8px}
.composer .foot .hint{font-size:12px;color:var(--g500);flex:1}
.range{width:100%;accent-color:var(--blue)}
.salbig{font-size:22px;font-weight:800;text-align:center}
.salbig small{display:block;font-size:12px;color:var(--g500);font-weight:600}

/* ── 로딩 ── */
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--blue-bg);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading b{font-size:17px}
.loading p{margin:0;font-size:13px;color:var(--g500);min-height:20px}
.memo{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--g600);background:var(--g50);
  border-radius:12px;padding:10px 12px;text-align:left;width:100%;max-width:320px;white-space:pre-wrap}

/* ── 허브 (결과) ── */
.tabbar{flex:0 0 auto;display:flex;background:#fff;box-shadow:0 -1px 0 var(--g200);
  padding:4px 4px calc(4px + var(--sab))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;
  font-size:10.5px;font-weight:700;color:var(--g400);border-radius:12px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--g900)}
.tabbar button:active{background:var(--g50)}
.tabbar[hidden]{display:none}
.card{background:#fff;border-radius:20px;padding:14px 16px;margin-top:10px}
.card:first-child{margin-top:4px}
.card .ct{font-size:13px;font-weight:700;color:var(--g500);display:flex;align-items:center;gap:6px;margin-bottom:9px}
.card .ct .r{margin-left:auto;font-size:11px;font-weight:700;color:var(--g400)}
.card .ct .r.link{color:var(--blue)}
.me-row{display:flex;gap:12px;align-items:center}
.me-row .cv{width:84px;height:100px;flex:0 0 84px;border-radius:16px;background:linear-gradient(180deg,#EFF6FF,#F7FAFF);display:grid;place-items:end center;overflow:hidden;position:relative}
.me-row .mx{flex:1;min-width:0}
.me-row .k{font-size:12px;color:var(--g500);font-weight:600}
.me-row .t{font-size:19px;font-weight:800;letter-spacing:-0.6px;line-height:1.3;margin-top:2px}
.kvs{display:flex;gap:6px;margin-top:8px}
.kvs div{flex:1;background:var(--g50);border-radius:11px;padding:7px 8px}
.kvs b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.kvs span{font-size:10.5px;color:var(--g500)}
.verd{border-radius:16px;padding:12px 14px}
.verd.hit{background:var(--blue-bg)}
.verd.near{background:#FFF7E6}
.verd.none{background:var(--g50)}
.verd .vh{font-size:14.5px;font-weight:800;letter-spacing:-0.4px}
.verd.hit .vh{color:var(--blue-d)}
.verd.near .vh{color:#A8650A}
.verd .vb{font-size:12.5px;color:var(--g700);margin-top:4px;line-height:1.5}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qa button{background:var(--g50);border-radius:14px;padding:10px 2px 8px;font-size:11.5px;font-weight:700;color:var(--g700);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.qa button i{font-style:normal;font-size:20px}
.qa button:active{background:var(--g100)}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 0;width:100%;text-align:left}
.linkrow+.linkrow{border-top:1px solid var(--g100)}
.linkrow .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--g50);display:grid;place-items:center;font-size:18px}
.linkrow .bd{flex:1;min-width:0}
.linkrow .bd b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkrow .bd span{display:block;font-size:11.5px;color:var(--g500)}
.linkrow .ar{color:var(--g400);font-size:18px}
.linkrow .sc{font-size:15px;font-weight:800;color:var(--blue)}

/* 세그먼트 (토스) */
.seg{display:flex;background:var(--g200);border-radius:12px;padding:3px;gap:2px;flex:0 0 auto}
.app.gray .seg{background:#E4E7EB}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:700;color:var(--g600);transition:.15s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button em{font-style:normal;color:var(--blue);margin-left:2px}

/* 직업 카드 페이저 */
.pagerwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.pager{flex:1;min-height:0;position:relative;touch-action:pan-y}
.pcard{position:absolute;inset:0;background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .35s}
.pcard .hd{display:flex;gap:12px;align-items:center}
.pcard .ic{width:50px;height:50px;flex:0 0 50px;border-radius:15px;background:var(--g50);display:grid;place-items:center;font-size:26px}
.pcard .nm{font-size:19px;font-weight:800;letter-spacing:-0.6px;line-height:1.3}
.pcard .ca{font-size:12px;color:var(--g500)}
.pcard .pc{margin-left:auto;text-align:right}
.pcard .pc b{display:block;font-size:24px;font-weight:900;color:var(--blue);letter-spacing:-0.6px;line-height:1}
.pcard .pc span{font-size:10.5px;color:var(--g500)}
.pcard .why{margin-top:12px;font-size:13px;line-height:1.55;color:var(--g700);background:var(--g50);border-radius:13px;padding:10px 12px}
.pcard .why b{color:var(--g900)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.meta b{font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;
  background:var(--g50);color:var(--g700);white-space:nowrap}
.meta b.up{color:#0E9E68;background:#F0FBF6}
.meta b.flat{color:#B8730A;background:#FFFAF0}
.meta b.down{color:#C9384A;background:#FFF5F6}
.meta b.blue{color:var(--blue);background:var(--blue-bg)}
.meta b.warn{color:#C9384A;background:#FFF0F1}
.tagmini{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;
  background:var(--blue);color:#fff;margin-right:4px;vertical-align:1px;white-space:nowrap}
.certrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--g100);font-size:13px}
.certrow b{flex:1;min-width:0}
.certrow span{font-size:11.5px;color:var(--g500)}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--g300);transition:.25s}
.dots i.on{width:18px;background:var(--blue)}
.dots .nav{width:32px;height:32px;border-radius:50%;background:#fff;font-size:17px;color:var(--g600);display:grid;place-items:center;margin:0 6px}
.dots .nav:disabled{opacity:.35}
.morphbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:6px 12px 6px 6px;margin:8px 0}
.morphbar .cv{width:54px;height:64px;flex:0 0 54px;border-radius:13px;background:var(--blue-bg);display:grid;place-items:end center;overflow:hidden}
.morphbar .t{flex:1;font-size:12.5px;color:var(--g600);line-height:1.45}
.morphbar .t b{color:var(--g900)}

/* 공고 */
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;flex:0 0 auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{font-size:12px;padding:7px 11px;background:#fff}
.filters .chip.on{background:var(--g900);color:#fff;border-color:var(--g900)}
.plist{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;margin-top:8px}
.post{background:#fff;border-radius:18px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.post:active{transform:scale(.99)}
.post{height:80px;flex:0 0 80px}
.post .bd{flex:1;min-width:0;display:block}
.post .co,.post .ti,.post .mt{display:block}
.post .co{font-size:11.5px;color:var(--g500);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .ti{font-size:14.5px;font-weight:700;letter-spacing:-0.4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .mt{font-size:11.5px;color:var(--g600);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .dd{font-weight:800;color:var(--red)}
.ring{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--g100) 0)}
.ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff}
.ring b{position:relative;font-size:13px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.heart{font-size:17px;color:var(--g300)}
.heart.on{color:var(--red)}
.stbadge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--g900);color:#fff}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--g500);font-size:13.5px;line-height:1.6}
.pnav{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:8px;font-size:13px;font-weight:700;color:var(--g600)}
.pnav button{width:34px;height:34px;border-radius:50%;background:#fff;font-size:17px}
.pnav button:disabled{opacity:.35}
.axes{display:flex;flex-direction:column;gap:8px}
.ax .top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.ax .top em{margin-left:auto;font-style:normal;color:var(--g500);font-size:11.5px;font-variant-numeric:tabular-nums}
.ax .bar{height:6px;border-radius:4px;background:var(--g100);margin-top:4px;overflow:hidden}
.ax .bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.ax p{margin:3px 0 0;font-size:11.5px;color:var(--g500)}
.gap{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--g50);margin-top:6px;font-size:12.5px}
.gap .t{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--red);color:#fff}
.gap .t.p{background:var(--yellow)}
.gap b{flex:1}
.gap em{font-style:normal;font-size:11px;font-weight:700;color:var(--blue)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;line-height:1.5;background:#0F1621;color:#B9D3FF;
  border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:42vh;overflow:auto;text-align:left}
select.sel{height:40px;border-radius:11px;border:1.5px solid var(--g200);background:var(--g50);padding:0 10px;font-size:13.5px;font-weight:700;color:var(--g800);outline:none}

/* 준비 */
.road{display:flex;flex-direction:column}
.rstep{display:flex;gap:11px;align-items:center;padding:9px 0;position:relative}
.rstep+.rstep{border-top:1px solid var(--g100)}
.rstep .no{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--g100);color:var(--g600);font-size:12px;font-weight:800;display:grid;place-items:center}
.rstep.hot .no{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-bg)}
.rstep.done .no{background:var(--green);color:#fff}
.rstep .bd{flex:1;min-width:0}
.rstep .bd b{display:block;font-size:13.5px;font-weight:700;line-height:1.35}
.rstep .bd span{display:block;font-size:11.5px;color:var(--g500);line-height:1.4}
.rstep.hot .bd b{color:var(--blue-d)}
.rstep .tg{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;background:var(--g100);color:var(--g600);margin-left:4px;vertical-align:1px}
.rstep .go{font-size:11.5px;font-weight:700;color:var(--blue);flex:0 0 auto}
.cbox{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:1.5px solid var(--g300);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.cbox.on{background:var(--green);border-color:var(--green)}
.tl{position:relative;height:74px;margin-top:6px}
.tl .ax{position:absolute;left:0;right:0;top:44px;height:2px;background:var(--g200)}
.tl .vac{position:absolute;top:30px;height:30px;background:rgba(21,196,126,.16);border-radius:6px;border:1px dashed var(--green)}
.tl .mk{position:absolute;width:10px;height:10px;border-radius:50%;margin-left:-5px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tl .mk.ex{top:24px;background:var(--purple)}
.tl .mk.jb{top:40px;background:var(--red)}
.tl .mk.hit{box-shadow:0 0 0 3px rgba(21,196,126,.55)}
.tl .dl{position:absolute;top:10px;bottom:6px;width:2px;background:var(--g900);margin-left:-1px}
.tl .dl span{position:absolute;top:-10px;left:4px;font-size:10px;font-weight:800;white-space:nowrap}
.tl .lab{position:absolute;bottom:0;font-size:10px;color:var(--g400);transform:translateX(-50%)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--g500);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.evt{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--g100);font-size:13px}
.evt .d{flex:0 0 50px;font-weight:800;font-variant-numeric:tabular-nums;font-size:12.5px}
.evt .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt .k{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff}
.money{text-align:center;padding:4px 0}
.money .big{font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--g900);font-variant-numeric:tabular-nums}
.money .big em{font-style:normal;font-size:16px;font-weight:700;margin-left:2px}
.money .split{display:flex;gap:6px;margin-top:10px}
.money .split div{flex:1;background:var(--g50);border-radius:12px;padding:8px}
.money .split b{display:block;font-size:14.5px;font-weight:800}
.money .split span{font-size:10.5px;color:var(--g500)}
.slrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--g600);margin-top:10px}
.slrow input{flex:1}
.slrow b{flex:0 0 64px;text-align:right;color:var(--g900);font-size:13px}
.ckl{display:flex;align-items:center;gap:10px;padding:8px 0;width:100%;text-align:left}
.ckl+.ckl{border-top:1px solid var(--g100)}
.ckl .d{flex:0 0 58px;font-size:11.5px;font-weight:800;color:var(--g500);font-variant-numeric:tabular-nums}
.ckl .d.soon{color:var(--red)}
.ckl .bd{flex:1;min-width:0}
.ckl .bd b{display:block;font-size:13.5px}
.ckl .bd span{display:block;font-size:11px;color:var(--g500);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckl.on .bd b{text-decoration:line-through;color:var(--g400)}
.resume{font-size:13.5px;line-height:1.65;color:var(--g800)}
.resume ul{margin:4px 0 0;padding-left:18px}
.resume li{margin:2px 0}
.resume .qt{background:var(--g50);border-radius:13px;padding:10px 12px;margin-top:6px}
.civil{display:flex;flex-wrap:wrap;gap:6px}
.civil b{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--blue-bg);color:var(--blue-d)}

/* 온톨로지 3D */
.onto{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16233A 0%,#0A101B 70%)}
.onto canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto;touch-action:none;cursor:grab}
.onto .ohd{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.onto .ohd .r1{display:flex;align-items:center;gap:8px;color:#fff}
.onto .ohd .r1 b{font-size:14.5px}
.onto .ohd .r1 span{font-size:11px;color:rgba(255,255,255,.55)}
.onto .ohd .r1 .ob{margin-left:auto;pointer-events:auto}
.ofil{display:flex;gap:5px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
.ofil::-webkit-scrollbar{display:none}
.ofil button{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);white-space:nowrap;border:1px solid rgba(255,255,255,.08)}
.ofil button.on{color:#fff;background:rgba(255,255,255,.14)}
.ofil button i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.obtn{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.obtn:active{background:rgba(255,255,255,.24)}
.oinfo{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.97);border-radius:18px;padding:12px 14px;
  transform:translateY(120%);transition:transform .3s cubic-bezier(.22,1,.36,1);max-height:52%;overflow-y:auto}
.oinfo.on{transform:none}
.oinfo .oc{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;color:#fff;display:inline-block}
.oinfo h4{margin:5px 0 0;font-size:16px;letter-spacing:-0.4px}
.oinfo p{margin:3px 0 0;font-size:12px;color:var(--g600);line-height:1.5}
.oinfo .tri{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--g700);background:var(--g50);border-radius:9px;padding:7px 9px;margin-top:7px;line-height:1.6;white-space:pre-wrap}
.oinfo .acts{display:flex;gap:6px;margin-top:8px}
.oinfo .acts button{flex:1;height:36px;border-radius:10px;background:var(--g100);font-size:12.5px;font-weight:700}
.oinfo .acts button.p{background:var(--blue);color:#fff}
.ohint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.5);pointer-events:none;transition:opacity .3s}

/* 바텀시트 */
.sheetbg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheetbg.on{display:flex;animation:mfade .2s}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:8px 20px calc(16px + var(--sab));
  max-height:88dvh;display:flex;flex-direction:column;animation:sheetin .32s cubic-bezier(.22,1,.36,1)}
@keyframes sheetin{from{transform:translateY(100%)}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--g300);margin:0 auto 10px;flex:0 0 auto}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto}
.sheet .sbody::-webkit-scrollbar{width:0}
.sheet .sfoot{flex:0 0 auto;padding-top:10px;display:flex;gap:8px}
.sheet h3{margin:0;font-size:19px;letter-spacing:-0.6px;line-height:1.35}

/* ── 모달 (명함·나의모습·전역카드) ── */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:calc(16px + var(--sat)) 22px calc(16px + var(--sab));
  background:rgba(12,17,24,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:mfade .25s}
@keyframes mfade{from{opacity:0}}
.modal .inner{width:100%;max-width:330px;text-align:center;max-height:100%;overflow-y:auto}
.modal .inner::-webkit-scrollbar{width:0}
.modal .ttl{color:#fff;font-size:20px;font-weight:800;letter-spacing:-0.5px;animation:up .45s .1s backwards}
.modal .dsc{color:rgba(255,255,255,.72);font-size:12.5px;margin:4px 0 12px;animation:up .45s .16s backwards}
.cardcv{display:block;margin:0 auto;border-radius:18px;box-shadow:0 28px 64px -14px rgba(0,0,0,.6);
  animation:cardin .55s cubic-bezier(.34,1.3,.64,1) backwards;animation-delay:.05s;image-rendering:auto}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.88) rotate(-4deg)}}
.namein{width:100%;margin-top:8px;height:42px;border-radius:12px;text-align:center;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:-0.3px;outline:none}
.namein::placeholder{color:rgba(255,255,255,.45);font-weight:500}
.namein:focus{border-color:#fff;background:rgba(255,255,255,.18)}
.macts{display:flex;gap:8px;margin-top:8px}
.macts button{flex:1;height:46px;border-radius:13px;font-size:14.5px;font-weight:700}
.mclose{background:rgba(255,255,255,.14);color:#fff}
.msave{background:#fff;color:var(--g900)}
.macts button:active{transform:scale(.97)}
.photobox{border-radius:18px;overflow:hidden;background:var(--g100);position:relative}
#photoCv{display:block;width:100%;height:auto;image-rendering:auto}
.filebtn{display:block;width:100%;height:46px;border-radius:13px;background:rgba(255,255,255,.14);
  color:#fff;font-size:14.5px;font-weight:700;margin-top:8px;line-height:46px;text-align:center;cursor:pointer}
#photoFile{display:none}
.privacy{font-size:11px;color:rgba(255,255,255,.62);margin-top:8px;line-height:1.5}

/* ══════ Mil-Kit v5 ══════ */
:root{--olive:#4A5A2A;--olive-d:#3A481F;--olive-bg:#F3F5EC}
main{padding:6px 20px 10px}
/* 스플래시 */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.sp-txt{display:flex;flex-direction:column;gap:2px;animation:up .6s .1s backwards}
.sp-txt b{font-size:26px;font-weight:900;letter-spacing:-1px;color:var(--olive-d)}
.sp-txt b:last-child{color:var(--g900)}
.sp-stage{position:relative;width:240px;height:220px}
.sp-stage.small{width:170px;height:156px}
.capsvg{position:absolute;left:0;right:0;bottom:24px;width:100%;overflow:visible}
.sp-stage.small .capsvg{bottom:16px}
.capsvg .st{opacity:0;transform-box:fill-box;animation:steam5 1.4s ease-in-out .9s infinite}
.capsvg .st1{animation-delay:1.05s}.capsvg .st2{animation-delay:1.2s}.capsvg .st3{animation-delay:1.35s}
.cook .capsvg .st{animation-delay:0s}.cook .capsvg .st1{animation-delay:.2s}.cook .capsvg .st2{animation-delay:.4s}.cook .capsvg .st3{animation-delay:.6s}
@keyframes steam5{0%{opacity:0;transform:translateY(10px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.capsvg .mark{transform-box:fill-box;transform-origin:center;animation:markpop .5s cubic-bezier(.34,1.56,.64,1) .2s backwards}
@keyframes markpop{from{transform:translate(100px,104px) scale(0)}}
.ing{position:absolute;top:-10px;font-size:30px;opacity:0;animation:drop .55s cubic-bezier(.55,0,.8,.4) forwards}
.ing.i1{left:58px;animation-delay:.25s}.ing.i2{left:106px;animation-delay:.45s}.ing.i3{left:150px;animation-delay:.65s}.ing.i4{left:84px;animation-delay:.85s}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) rotate(-20deg)}20%{opacity:1}100%{opacity:0;transform:translateY(96px) rotate(25deg) scale(.6)}}
.flame{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end}
.flame i{width:16px;height:22px;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,#FDBA74,#F97316 60%,#3B82F6);animation:flk .28s ease-in-out infinite alternate}
.flame i:nth-child(2){height:28px;animation-delay:.1s}.flame i:nth-child(3){animation-delay:.2s}
@keyframes flk{to{transform:scaleY(1.25)}}
.stamp{position:absolute;right:-6px;top:30px;padding:6px 14px;border:3px solid var(--red);color:var(--red);font-weight:900;font-size:20px;border-radius:10px;
  transform:rotate(-12deg) scale(0);opacity:0;animation:stamp .4s cubic-bezier(.34,1.56,.64,1) 1.8s forwards;background:rgba(255,255,255,.85)}
@keyframes stamp{to{transform:rotate(-12deg) scale(1);opacity:1}}
.sp-brand{display:flex;flex-direction:column;align-items:center;animation:up .5s 1.9s backwards}
.sp-brand b{font-size:30px;font-weight:900;color:var(--olive-d);letter-spacing:-1px}
.sp-brand span{font-size:12px;font-weight:700;color:var(--g500);letter-spacing:.5px}
.sp-note{font-size:11px;color:var(--g400);margin:0;max-width:300px;line-height:1.5;animation:up .5s 2s backwards}
.splash:not(.done) .sp-brand{opacity:.0}
.splash.done .sp-brand{opacity:1}
/* 입대 */
.letter{display:flex;gap:12px;align-items:center;background:var(--olive-bg);border-radius:18px;padding:14px 16px;margin-top:6px}
.letter span{font-size:30px}.letter b{display:block;font-size:17px}.letter small{font-size:13px;color:var(--g600)}
.fgrid.f5{grid-template-rows:repeat(3,minmax(0,1fr))}
.opt.tile.wide{grid-column:1/-1;flex-direction:row;gap:14px}
.opt.tile.wide .big{font-size:34px}
/* 신상명세서 */
.paper{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:6px;background:#FFFDF6;border:1.5px solid #E8E1C8;border-radius:16px;padding:14px;
  box-shadow:0 2px 0 #EFE8D0;position:relative}
.paper .ph{text-align:center;border-bottom:2px solid #2B2B2B;padding-bottom:8px}
.paper .ph b{display:block;font-size:20px;letter-spacing:6px}
.paper .ph span{font-size:11.5px;color:var(--g500)}
.npc{display:flex;gap:8px;align-items:flex-start}
.npc span{font-size:24px}
.npc p{margin:0;background:var(--g100);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:13px;line-height:1.5}
.pf label{display:block;font-size:12.5px;font-weight:800;color:var(--g700);margin-bottom:6px}
.pf label small{font-weight:600;color:var(--g500)}
.pf.grow{flex:1;min-height:0}
.chips5{display:flex;flex-wrap:wrap;gap:6px}
.chips5 .chip{background:#fff;border-color:var(--g200)}
.chips5.mj{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chips5.mj .chip{padding:9px 4px;text-align:center}
.pseal{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:var(--g400)}
/* 이벤트 */
.scene{border-radius:20px;background:linear-gradient(160deg,#2F3A1E,#4A5A2A);color:#fff;padding:14px 14px 16px;margin-top:4px}
.sc-top{display:flex;align-items:center;gap:8px}
.sc-emoji{font-size:26px}
.sc-where{font-size:12.5px;font-weight:700;opacity:.85;flex:1}
.sc-ch{width:40px;height:50px;background:rgba(255,255,255,.12);border-radius:10px;display:grid;place-items:end center;overflow:hidden}
.sc-bub{margin-top:10px;background:#fff;color:var(--g900);border-radius:4px 16px 16px 16px;padding:11px 13px;font-size:16px;font-weight:700;line-height:1.5}
.sc-bub em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--olive);margin-bottom:2px}
.evbody{flex:1;min-height:0;margin-top:12px}
.evsingle{display:flex;flex-direction:column;gap:8px;justify-content:center}
.evopt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-radius:15px;background:var(--g50);border:1.5px solid transparent;text-align:left;width:100%}
.evopt b{font-size:16px}.evopt span{font-size:12px;color:var(--g500)}
.evopt.on{background:var(--blue-bg);border-color:var(--blue)}
.evopt:active{transform:scale(.985)}
.evmulti{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start}
.evchip{position:relative;padding:12px 4px;border-radius:13px;background:var(--g50);border:1.5px solid transparent;font-size:13.5px;font-weight:700;color:var(--g700);text-align:center}
.evchip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-d)}
.evchip i{position:absolute;right:5px;top:3px;font-style:normal;font-size:10px;color:#F59E0B}
.evslider{display:flex;flex-direction:column;justify-content:center;gap:14px}
.salcmp{text-align:center;font-size:13px;color:var(--g600)}
.evtext{display:flex;flex-direction:column;gap:10px}
.rolling{background:#FFF8E1;border-radius:16px;padding:14px;transform:rotate(-1deg)}
.rolling small{display:block;text-align:right;color:var(--g500);margin-top:6px;font-size:11.5px}
.evfoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--g400);padding-top:8px}
.evfoot b{color:var(--g600)}.evfoot .st{font-style:normal;color:#F59E0B}
.sheetopts{margin-top:6px}
/* 진급 */
.collected .cl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--g100);font-size:13px}
.collected .cl span{color:var(--g500)}
.collected .cl b{text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 브리핑 */
.brief{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.bh b{display:block;font-size:22px;font-weight:900;letter-spacing:-0.6px}
.bh span{font-size:12.5px;color:var(--g500)}
.api{border:1.5px solid var(--g200);border-radius:16px;padding:10px 12px;background:#fff}
.ah{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ah i{font-style:normal;font-size:10px;font-weight:900;padding:3px 6px;border-radius:5px;color:#fff}
.ah i.jk{background:#0FA36B}.ah i.qn{background:#2B5BD7}
.ah b{font-size:14px;flex:1}.ah span{font-size:11px;color:var(--g400)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto;column-gap:8px;padding:6px 0;border-top:1px solid var(--g100);text-align:left;width:100%}
.prow code{grid-row:1/3;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--blue-d);background:var(--blue-bg);border-radius:6px;padding:3px 6px;align-self:center;word-break:break-all}
.prow b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow span{font-size:10.5px;color:var(--g400)}
button.prow:active{background:var(--g50)}
/* 결과 */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rbody .card{margin:0}
.menu .mrow{display:flex;gap:12px;align-items:center}
.menu .cv{width:64px;height:76px;flex:0 0 64px;border-radius:14px;background:var(--olive-bg);display:grid;place-items:end center;overflow:hidden}
.menu .k{font-size:11px;font-weight:800;color:var(--olive)}
.menu b{display:block;font-size:19px;font-weight:900;letter-spacing:-0.6px;line-height:1.3}
.menu small{font-size:12px;color:var(--g500)}
.menu .kvs{margin-top:10px}
.crow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--g100);width:100%;text-align:left;background:#fff}
.fgrid.one .crow{border:0;border-radius:14px;padding:8px 12px;height:100%}
.crow .bd{flex:1;min-width:0}.crow .bd b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bd span{display:block;font-size:11px;color:var(--g500)}
.crow em{font-style:normal;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;flex:0 0 auto}
.crow em.ok{background:#ECFDF3;color:#0E9E68}.crow em.no{background:#FFF0F1;color:#C9384A}
.sb{font-size:10px;font-weight:900;padding:3px 6px;border-radius:6px;color:#fff;background:var(--g500);flex:0 0 auto}
.sb.s05{background:#15C47E}.sb.s04{background:#3182F6}.sb.s03{background:#8B5CF6}.sb.s02{background:#F59E0B}.sb.s01{background:#191F28}
.road3{flex:1;display:flex;align-items:stretch;gap:4px}
.road3 em{align-self:center;font-style:normal;color:var(--g300)}
.rd{flex:1;border-radius:14px;background:var(--g50);padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid transparent}
.rd.ok{border-color:#BFEBD8;background:#F0FBF6}
.rd i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--olive);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.rd b{font-size:12.5px;line-height:1.3;word-break:keep-all}
.rd span{font-size:10.5px;color:var(--g500)}
.post2{background:#fff;border-radius:16px;padding:9px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%;height:100%;justify-content:center;min-height:0}
.post2 .co{font-size:11px;color:var(--g500);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post2 .ti{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post2 .mt{font-size:11.5px;color:var(--g600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post2 .mt em{font-style:normal;color:var(--red);font-weight:800}
.post2 .cc{display:flex;gap:4px;overflow:hidden}
.post2 .cc i{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:#FFF0F1;color:#C9384A;white-space:nowrap}
.post2 .cc i.ok{background:#ECFDF3;color:#0E9E68}.post2 .cc i.none{background:var(--g100);color:var(--g500)}
.qtbl{display:grid;grid-template-columns:1fr;gap:2px;font-size:12px}
.qtbl div{display:flex;gap:8px;padding:5px 8px;background:var(--g50);border-radius:8px}
.qtbl code{flex:0 0 110px;color:var(--blue-d);font-family:ui-monospace,Consolas,monospace;font-size:11px}
html.compact .scene{padding:10px 12px 12px}
html.compact .sc-bub{font-size:14.5px;padding:9px 11px}
html.compact .evopt{padding:11px 14px}
html.compact .sp-stage{width:200px;height:184px}
html.compact .sp-txt b{font-size:22px}
html.compact .paper{gap:7px;padding:11px}
html.compact .chips5.mj .chip{padding:7px 2px;font-size:12px}

/* ═══ fix2 ═══ */
/* splash: 버튼만 올라온다 (자리 미리 확보) */
.cta .btn.hold{opacity:0;transform:translateY(28px);pointer-events:none}
.cta #start{transition:opacity .45s ease,transform .5s cubic-bezier(.2,.9,.3,1.2)}
.chal{display:flex;flex-direction:column;gap:2px;background:#FFF7E0;border:1.5px solid #F2D27A;border-radius:14px;padding:9px 14px;animation:up .5s 2s backwards}
.chal b{font-size:13.5px;color:#8A5A00}.chal span{font-size:12px;color:var(--g600)}
/* form: 병무청 담당자가 신상명세서를 건넨다 */
.mma{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.mma-av{width:58px;height:58px;flex:0 0 58px;border-radius:16px;background:#E8EEF8;overflow:hidden;animation:mmaIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.mma-av svg{width:100%;height:100%;display:block}
.mma-b{flex:1;animation:pop .35s .35s backwards}
.mma-b em{display:block;font-style:normal;font-size:11px;font-weight:800;color:#2B5BD7;margin:0 0 2px 2px}
.mma-b p{margin:0;background:#EEF3FB;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:13px;line-height:1.5}
@keyframes mmaIn{from{transform:translateX(-40px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.paper.handoff{transform-origin:12% 0;animation:handoff .6s .75s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes handoff{from{transform:translate(-18%,-6%) scale(.25) rotate(-10deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.chips5.edu{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips5.edu .chip{grid-column:span 2;text-align:center;padding:9px 2px;border-radius:12px}
.chips5.edu .chip:nth-child(n+4){grid-column:span 3}
.chips5.mj .chip{border-radius:12px}

.scene2.sm .sc-npc{width:52px;height:52px}

.cinfo span{font-size:11px;color:var(--g500)}.cinfo b{font-size:13.5px}

.cardtab .btn-row .btn{flex:1}
/* 공유 시트 */

/* ═══ fix3 (v6) ═══ */
main#scr.pgin{animation:pgin .42s cubic-bezier(.2,.85,.3,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
/* 신상명세서: 안내 문구가 버튼에 가리지 않게 흐름 안에 둔다 */
.pseal{position:static;flex:0 0 auto;text-align:right;line-height:1.4;padding-top:2px}
.chips5.mj .chip{min-height:0}
/* 자대 배치 1페이지 */
.famgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:8px;margin-top:10px}
.famt{display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;min-height:0}
.famt .em{font-size:24px;flex:0 0 auto}
.famt .tx{display:flex;flex-direction:column;min-width:0}
.famt .tt{font-size:15px;font-weight:800}
.famt .dd{font-size:11.5px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subpick{flex:0 0 auto;margin-top:10px;background:var(--g50);border-radius:14px;padding:9px 11px}
.subpick .sl{display:block;font-size:12px;font-weight:800;color:var(--g700);margin-bottom:6px}
.subpick .sl small{font-weight:600;color:var(--g500)}
.subpick .sh{font-size:12.5px;color:var(--g500)}
.subchips{display:flex;flex-wrap:wrap;gap:6px;max-height:70px;overflow:hidden}
.subchips .chip{background:#fff;border-color:var(--g200);padding:6px 11px;font-size:12.5px}
/* 요약: 카드 아이콘 */
.menu .mtx{flex:1;min-width:0}
.mico{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.mico button{width:58px;height:42px;border-radius:12px;background:var(--g50);border:1.5px solid var(--g200);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:1}
.mico button span{font-size:9.5px;font-weight:800;color:var(--g600);margin-top:2px}
.mico button:active{transform:scale(.95)}
.cvbox.sh{flex:none;margin-top:10px}
#sheet .ncin{margin-top:8px}

html.compact .famt .tt{font-size:14px}

html.compact .mico button{height:36px;width:54px}
.pseal{padding-top:0;line-height:1.2}
.paper{gap:9px}
.paper{margin-top:3px}
.chips5.mj{min-height:0}
.pf.grow>label{flex:0 0 auto}
.menu .mtx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ v7 · 효과 · 데스크톱 무대 ═══ */
body{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#EEF1F5}
.app{isolation:isolate;will-change:transform}
.ghost{will-change:transform,filter}
.ghost *{animation:none!important;transition:none!important}

/* 움직이는 배경 (데스크톱에서 보임) */
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:-1;background:linear-gradient(135deg,#EEF3E6,#E8F0FB 55%,#FDF2E7)}
.bgfx i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:blob 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:#B9CC8E;left:-12vmax;top:-10vmax}
.bgfx i:nth-child(2){background:#9EC5FF;right:-14vmax;top:20vh;animation-duration:22s}
.bgfx i:nth-child(3){background:#FFD59E;left:20vw;bottom:-20vmax;animation-duration:26s}
@keyframes blob{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.side{display:none}

/* 넓은 화면: 휴대폰 무대 + 소개 */
@media(min-width:900px){
  body{display:flex;align-items:center;justify-content:center;gap:72px;min-height:100dvh}
  .app{margin:0;height:min(880px,calc(100dvh - 48px));width:410px;flex:0 0 410px;border-radius:44px;
    box-shadow:0 0 0 10px #15181D,0 0 0 12px #2A2F37,0 40px 90px -20px rgba(20,30,50,.45)}
  .side{display:flex;flex-direction:column;gap:14px;max-width:320px;color:#1F2A14;animation:up .8s .2s backwards}
  .side b{font-size:54px;font-weight:900;letter-spacing:-2px;line-height:1;background:linear-gradient(120deg,#3F4D22,#6B7A4A 40%,#3182F6);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .side span{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.3}
  .side ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .side li{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:14px;padding:11px 14px;font-weight:700;font-size:15px;
    box-shadow:0 4px 18px -8px rgba(0,0,0,.15)}
  .sheetbg{border-radius:0}
}

/* 물결 */
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* 버튼 · 선택 반응 */
.btn{position:relative;overflow:hidden;box-shadow:0 8px 20px -10px rgba(49,130,246,.7)}
.btn:not(:disabled)::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-100%);animation:shine 3.2s 1s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.btn.sub{box-shadow:none}.btn.sub::after,.btn:disabled::after{display:none}
.opt.on,.evopt.on,.evchip.on,.chip.on,.famt.on{animation:popsel .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes popsel{0%{transform:scale(.94)}100%{transform:scale(1)}}
.evchip,.evopt,.famt,.opt{transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.evchip.on,.famt.on,.opt.on{box-shadow:0 6px 18px -10px rgba(49,130,246,.8)}

/* 진행 바 반짝 */
.prog i{position:relative;overflow:hidden}
.prog i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 2.4s linear infinite}

/* 스플래시 */
.sp-txt .ch{display:inline-block;font-style:normal}
.splash{position:relative}
.splash::before{content:'';position:absolute;left:50%;top:46%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,196,110,.35),transparent 65%);animation:glow 2.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:scale(1.15);opacity:.7}}

/* 진급 */
.fstage{box-shadow:inset 0 -40px 60px -30px rgba(0,0,0,.35)}

/* 결과 */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tags i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--g600);background:var(--g100);padding:3px 8px;border-radius:999px}
.sfoot a.btn{text-decoration:none}
.menu .cv{position:relative}
.menu .cv::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
  animation:shine 4s 1.2s ease-in-out infinite}
.rd{transition:transform .2s}
.rd:hover{transform:translateY(-2px)}
.course .road3 em{animation:arrow 1.6s ease-in-out infinite}
@keyframes arrow{50%{transform:translateX(3px);color:var(--olive)}}
.kvs b{font-variant-numeric:tabular-nums}
.chips5.mj .chip{padding-top:6px;padding-bottom:6px}
.paper{gap:7px}
.pseal{line-height:1.1}

/* 진급 문구: 또렷하게 */
.celebrate .rankbig{color:var(--g900);font-size:31px;font-weight:900;letter-spacing:-1.2px;opacity:1;animation:none}
.celebrate .rankbig em{color:var(--blue-d);background:linear-gradient(transparent 62%,#DCEBFF 62%);padding:0 2px}
.celebrate .badge-up{background:var(--blue);color:#fff;font-weight:800;animation:none}
.deltas b{background:#fff;border:1.5px solid var(--g200);color:var(--g800)}
/* 공유 시트 */
.kakao{background:#FEE500!important;color:#191919!important;box-shadow:0 8px 20px -10px rgba(180,150,0,.6)!important}
.kakao::after{display:none}
.kakao svg{width:20px;height:20px}
.shrow{display:flex;gap:8px;margin-top:8px}
.shrow .btn{flex:1}
.ivcard img{width:100%;border-radius:8px;margin-bottom:6px;display:block}
.ivcard{width:78%}

/* ═══ 상단 제목 ═══ */
.tb-title{gap:8px;margin-left:6px}
.tbc{font-size:10.5px;font-weight:900;letter-spacing:.4px;color:#fff;background:linear-gradient(135deg,#3F4D22,#6B7A4A);padding:4px 8px;border-radius:7px;
  box-shadow:0 3px 8px -3px rgba(63,77,34,.6)}
.tbc.rk{background:linear-gradient(135deg,#1B64DA,#3182F6);box-shadow:0 3px 8px -3px rgba(49,130,246,.6)}
.tbi{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--g100);font-size:15px}
.tbi .rkm{width:12px;height:16px;fill:#3F4D22}
.tbt{font-size:16.5px;font-weight:900;letter-spacing:-.6px;color:var(--g900)}
.topbar .row{border-bottom:0}

/* ═══ 신상명세서: 공문서 서식 ═══ */
.paper{background:#FFFEF9;border:1px solid #2B2B2B;border-radius:4px;outline:3px double #2B2B2B;outline-offset:3px;padding:12px 12px 10px;
  box-shadow:0 14px 30px -18px rgba(0,0,0,.45);margin:10px 4px 6px;position:relative;
  background-image:radial-gradient(circle at 85% 18%,rgba(31,59,115,.05) 0 60px,transparent 61px),linear-gradient(#FFFEF9,#FFFDF4)}
.paper::before{content:'병무청';position:absolute;right:16px;bottom:70px;font-size:46px;font-weight:900;color:rgba(31,59,115,.045);transform:rotate(-14deg);pointer-events:none}
.ph2{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;border-bottom:2px solid #2B2B2B;padding-bottom:8px}
.ph2 .emb svg{width:38px;height:38px;display:block}
.ph2 .pt{text-align:center;display:flex;flex-direction:column;line-height:1.15}
.ph2 .pt small{font-size:9.5px;color:var(--g500);font-weight:700}
.ph2 .pt b{font-size:20px;font-weight:900;letter-spacing:7px;font-family:'Nanum Myeongjo','Batang','Pretendard Variable',serif;margin:2px 0}
.ph2 .pt span{font-size:10.5px;color:var(--g600)}
.serial{display:flex;flex-direction:column;align-items:center;gap:2px}
.serial .bar{width:44px;height:18px;background:repeating-linear-gradient(90deg,#222 0 1px,transparent 1px 3px,#222 3px 5px,transparent 5px 6px,#222 6px 7px,transparent 7px 9px)}
.serial em{font-style:normal;font-size:8.5px;color:var(--g500);font-variant-numeric:tabular-nums}
/* 표 형태 칸 */
.paper .pf{display:grid;grid-template-columns:30px 1fr;border:1px solid #2B2B2B;border-radius:0;min-height:0}
.paper .pf+.pf{border-top:0;margin-top:-7px}
.paper .pf>label{writing-mode:vertical-rl;text-orientation:upright;display:grid;place-items:center;margin:0;background:#EEF0E6;border-right:1px solid #2B2B2B;
  font-size:12px;font-weight:900;letter-spacing:6px;color:#2B2B2B}
.paper .pf>label small{display:none}
.paper .chips5{padding:7px;gap:5px}
.paper .chips5 .chip{border:1px solid #BFC3B6;border-radius:3px;background:#fff;color:#2B2B2B;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.paper .chips5 .chip::before{content:'';flex:0 0 12px;width:12px;height:12px;border:1.5px solid #555;border-radius:2px;background:#fff;
  display:grid;place-items:center;font-size:10px;line-height:1;color:#fff}
.paper .chips5 .chip.on{background:#EAF2FF;border-color:#1B64DA;color:#123E8C}
.paper .chips5 .chip.on::before{content:'✓';background:#1B64DA;border-color:#1B64DA}
.pfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex:0 0 auto;padding-top:2px}
.pfoot .pseal{position:static;font-size:10px;color:var(--g500)}
.sign{position:relative;font-size:13px;font-weight:900;letter-spacing:3px;font-family:'Nanum Myeongjo','Batang',serif;padding-right:30px}
.stamp{position:absolute;right:-4px;top:50%;width:34px;height:34px;margin-top:-17px;border:2.5px solid #D62F2F;border-radius:50%;color:#D62F2F;
  font-style:normal;font-size:9px;line-height:1.05;font-weight:900;letter-spacing:0;display:grid;place-items:center;text-align:center;
  transform:rotate(-12deg);opacity:.85;mix-blend-mode:multiply;animation:stampin .45s 1.5s cubic-bezier(.3,1.6,.6,1) backwards}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
html.compact .ph2 .pt b{font-size:17px}
html.compact .paper .pf>label{font-size:11px}
.paper{overflow:hidden}
.paper .chips5.edu .chip{font-size:12px;gap:4px;padding:8px 3px;letter-spacing:-.5px;white-space:nowrap}
.paper .chips5.edu .chip::before{flex-basis:11px;width:11px;height:11px}
html.compact .pfoot{justify-content:flex-end}

/* ═══ v9: 진로 · 코스 서비스 ═══ */
.famgrid.big{grid-auto-rows:minmax(64px,1fr)}
.famgrid.big .famt .tt{font-size:16px}
.pathgrid{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;margin-top:12px}
.pathc{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto auto;align-content:center;column-gap:12px;text-align:left;padding:14px 16px;
  border-radius:20px;background:var(--g50);border:2px solid transparent;transition:transform .15s,border-color .2s,background .2s}
.pathc .em{grid-row:1/4;font-size:38px;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#fff;box-shadow:0 6px 16px -10px rgba(0,0,0,.3)}
.pathc b{font-size:20px;font-weight:900;letter-spacing:-.6px}
.pathc span{font-size:13px;color:var(--g600)}
.pathc i{font-style:normal;font-size:11.5px;color:var(--blue-d);font-weight:700;margin-top:3px}
.pathc.on{background:var(--blue-bg);border-color:var(--blue)}
.pathc:active{transform:scale(.98)}
.schoolh{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#EEF5FF,#F5F9EE);border-radius:18px;padding:14px;margin-top:4px}
.schoolh .em{font-size:32px}
.schoolh b{display:block;font-size:17px;font-weight:900;letter-spacing:-.5px}
.schoolh small{font-size:12px;color:var(--g600)}
.course2{gap:8px}
.chd{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 4px 18px -12px rgba(0,0,0,.25)}
.chd .ctx{flex:1;min-width:0;display:flex;flex-direction:column}
.chd .k{font-size:11.5px;color:var(--g600)}.chd .k b{color:var(--olive);font-weight:900}
.chd .ctx>b{font-size:20px;font-weight:900;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chd small{font-size:12px;color:var(--g500)}.chd small b{color:var(--blue-d)}
.crs{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;border-radius:20px}
.crs::-webkit-scrollbar{display:none}
.ccard{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;background:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ccard h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:-.5px}
.ccard h4 span{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--g100);font-size:17px}
.ccard h4 em{margin-left:auto;font-style:normal;font-size:11px;color:var(--g400);font-weight:700}
.ccard .cb{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.kv2{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:7px 10px;background:var(--g50);border-radius:10px}
.kv2 span{color:var(--g600)}.kv2 b{font-weight:900}
.kv2.hi{background:#FFF7E0}.kv2.hi b{color:#B8730A}
.ebar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--g100)}
.ebar i,.elg i{display:inline-block}
.e0{background:#15C47E}.e1{background:#3182F6}.e2{background:#8B5CF6}.e3{background:#F04452}
.elg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--g600)}
.elg i{width:8px;height:8px;border-radius:2px;margin-right:3px}
.road3.mini .rd{padding:7px 4px}
.road3.mini .rd b{font-size:11.5px}
.clist{display:flex;flex-direction:column;gap:5px}
.cl2{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:8px;text-align:left;padding:7px 10px;border-radius:10px;background:var(--g50)}
.cl2 b{font-size:13.5px;font-weight:800}.cl2 span{font-size:11px;color:var(--g500)}
.cl2 em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.cl2 em.ok{background:#E6F8EF;color:#0F9D63}.cl2 em.no{background:#FFF0F0;color:#D62F2F}
.tcloud{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tcloud span{font-size:calc(13px * var(--w));font-weight:800;color:var(--g800);background:linear-gradient(135deg,#EEF5FF,#F3F8EC);border-radius:999px;padding:5px 11px;
  animation:pop .4s backwards}
.tcloud span:nth-child(1){background:linear-gradient(135deg,#3182F6,#6B7A4A);color:#fff}
.tcloud em{font-style:normal;font-size:10px;color:var(--g500);margin-left:4px}
.tcloud span:nth-child(1) em{color:#E8F0FF}
.proc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.proc li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--g50);position:relative}
.proc li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--olive);color:#fff;font-size:12px;flex:0 0 24px}
.proc li span{font-size:14px;font-weight:800}
.proc li em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:800;color:#0F9D63;background:#E6F8EF;padding:2px 7px;border-radius:999px}
.proc li+li::before{content:'';position:absolute;left:21px;top:-7px;width:2px;height:8px;background:var(--g300)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:8px;border-left:2px dashed var(--g300)}
.tl li{position:relative;display:flex;flex-direction:column;padding-left:6px}
.tl li::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.tl li.done::before{background:var(--olive);border-color:var(--olive)}

function fillPaged(box,n,minRow,page,draw,cols=2,gap=8){
  const rows=Math.max(1,Math.floor((box.clientHeight+gap)/(minRow+gap)));
  const per=rows*cols, pages=Math.max(1,Math.ceil(n/per)), pg=Math.min(page,pages-1);
  const shown=Math.min(per,n-pg*per), useRows=Math.max(1,Math.min(rows,Math.ceil(shown/cols)));
  box.style.gridTemplateRows=`repeat(${pages>1?rows:useRows},minmax(0,1fr))`;
  box.innerHTML=Array.from({length:shown},(_,k)=>draw(pg*per+k,k)).join('');
  return {pages,page:pg,per};
}

/* 능력치별 표준화(z-score).
   KNOW 원점수는 거의 모든 직업이 '꼼꼼함·신뢰성'(성실)을 높게 답해 공통 기저가 생긴다.

   '다른 직업 대비 두드러지는 역량'만 남긴 시그니처로 매칭한다. */
(function standardizeWeights(){
  for(const k of SK){
    const v=JOBS.map(j=>j.w[k]);
    const m=v.reduce((a,b)=>a+b,0)/v.length;
    const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1;
    JOBS.forEach(j=>{ j.z[k]=(j.w[k]-m)/sd; });
  }
})();

function jobkoreaList(q={}){
  const today=new Date().toISOString().slice(0,10);

  if(q.Keyword){const [must,...ors]=String(q.Keyword).split('|');const and=must.split(/[,&]/).map(s=>s.trim()).filter(Boolean);
    const hay=g=>g.GI_Subject+' '+g.C_Name+' '+g.GI_Keyword;
    L=L.filter(g=>and.every(k=>hay(g).includes(k))||ors.some(k=>hay(g).includes(k.trim())));}
  if(q.rbcd&&q.rbcd!=='0'){const B=String(q.rbcd).split(',');L=L.filter(g=>g.parts.some(p=>B.includes(RB_OF_PART[p])));}
  if(q.rpcd&&q.rpcd!=='0'){const P=String(q.rpcd).split(',');L=L.filter(g=>g.parts.some(p=>P.includes(p)));}
  if(q.area&&q.area!=='0'&&!String(q.area).includes('Q000')){const A=String(q.area).split(',').slice(0,6);
    L=L.filter(g=>g.areas.some(c=>A.some(a=>a.endsWith('000')?c[0]===a[0]:c===a)));}
  if(q.edu1!=null&&q.edu1!==''&&+q.edu1!==255) L=L.filter(g=>[0,255].includes(+g.GI_EDU_CutLine)||+g.GI_EDU_CutLine<=+q.edu1);
  if(q.mcareerchk&&+q.mcareerchk===1) L=L.filter(g=>['1','3','4'].includes(g.GI_Career));
  if(q.Jtype){const J=String(q.Jtype).split(',').slice(0,3);L=L.filter(g=>g.GI_Job_Type.split(',').some(t=>J.includes(t)));}
  if(q.pay==='1'&&q.payterm){const [a,b]=String(q.payterm).split(',').map(Number);
    L=L.filter(g=>{const r=annualRange(g);return r&&r[1]>=a&&r[0]<=b+1000;});}
  const ob={1:(a,b)=>b.GI_W_Date.localeCompare(a.GI_W_Date),2:(a,b)=>b.GI_E_Date.localeCompare(a.GI_E_Date)||b.GI_E_Time-a.GI_E_Time,
    3:(a,b)=>a.GI_End_Date.localeCompare(b.GI_End_Date)}[q.Ob||2];
  L=[...L].sort(ob);
  const size=Math.min(100,Math.max(1,+q.Size||100)),page=Math.max(1,+q.Page||1),items=L.slice((page-1)*size,page*size);
  return {DataList:{TotalSumCnt:String(L.length),TotalCnt:String(items.length),Items:items}};
}

/* 태극 — 중심(0,0) · 반지름 r. 빨강 위·파랑 아래, 경계(S자)는 건괘↔곤괘 대각선(3:2 깃면 33.69°) 위에 놓인다 */
function taegeukG(r){
  const h=r/2;
  return `<g transform="rotate(33.69)"><circle r="${r}" fill="#0047A0"/>`+
    `<path d="M${-r} 0A${r} ${r} 0 0 1 ${r} 0A${h} ${h} 0 0 0 0 0A${h} ${h} 0 0 1 ${-r} 0Z" fill="#CD2E3A"/></g>`;
}
/* 태극기 3:2 — (x,y) 왼쪽 위, 너비 w. 건(☰)좌상 · 곤(☷)우하 · 감(☵)우상 · 리(☲)좌하, 괘는 대각선에 수직 */
function flagSvg(x,y,w){
  const H=w*2/3, s=H/2, L=.5, t=1/12, g=1/24, gb=1/12, d0=.75;
  const tri=(pat,ang)=>`<g transform="rotate(${ang})">`+pat.map((solid,i)=>{const bx=d0+i*(t+g);
    return solid?`<rect x="${bx}" y="${-L/2}" width="${t}" height="${L}"/>`
      :`<rect x="${bx}" y="${-L/2}" width="${t}" height="${(L-gb)/2}"/><rect x="${bx}" y="${gb/2}" width="${t}" height="${(L-gb)/2}"/>`;}).join('')+'</g>';
  return `<g transform="translate(${x+w/2} ${y+H/2}) scale(${s})"><rect x="-1.5" y="-1" width="3" height="2" fill="#fff" stroke="#C9CDD2" stroke-width="${.6/s}"/>`+
    `${taegeukG(.5)}<g fill="#111">${tri([1,1,1],-146.31)}${tri([0,0,0],33.69)}${tri([0,1,0],-33.69)}${tri([1,0,1],146.31)}</g></g>`;
}

function mount(canvas,w){
  const dpr=Math.min(window.devicePixelRatio||1,3), U=w/GW, h=Math.round(GH*U);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.dataset.u=U;
}
let bob=0;
function tick(){
  bob+=0.05;
  document.querySelectorAll('canvas[data-u]').forEach(cn=>{
    const c=cn.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,3), U=+cn.dataset.u;
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,cn.width,cn.height);
    c.imageSmoothingEnabled=false;paint(c,U,Math.round(Math.sin(bob)*1.1*(U/6)));
  });
  requestAnimationFrame(tick);
}


/* ═══════════════════════════════════════════════════════════════
   [Mil-Kit v7 · FX] 화면 전환 · 효과
   - 전체 화면 넘김(세로): 새 화면이 아래에서 통째로 올라오고,
     이전 화면은 위로 살짝 밀리며 작아지고 어두워진다. 뒤로 가기는 반대(아래로 내려감).
   - 왼쪽 가장자리에서 오른쪽으로 쓸면 뒤로 가기
   - 버튼 물결(ripple) · 숫자 올라가기 · 축하 꽃가루 (CDN 라이브러리 없으면 조용히 생략)
   ═══════════════════════════════════════════════════════════════ */
const FX={busy:false, reduce:matchMedia('(prefers-reduced-motion: reduce)').matches};
function slide(dir,doRender){
  const app=$('app');
  if(FX.reduce||!app.animate||FX.busy){doRender();return;}
  FX.busy=true;
  const r=app.getBoundingClientRect();
  const ghost=app.cloneNode(true);
  ghost.removeAttribute('id'); ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  ghost.querySelectorAll('canvas').forEach(c=>c.removeAttribute('data-u'));
  const src=app.querySelectorAll('canvas'), dst=ghost.querySelectorAll('canvas');
  src.forEach((c,i)=>{try{dst[i].getContext('2d').drawImage(c,0,0);}catch(e){}});
  const m=$('scr'), gm=ghost.querySelector('main'); if(gm) gm.scrollTop=m.scrollTop;
  Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',
    margin:'0',pointerEvents:'none',zIndex:dir>0?'40':'60'});
  ghost.classList.add('ghost');
  document.body.appendChild(ghost);
  doRender();
  app.style.zIndex='50';
  const ease='cubic-bezier(.32,.72,0,1)', D=560;
  const wide=innerWidth>=900;   // 데스크톱 휴대폰 무대: 프레임 밖으로 나가지 않게 짧게 밀고 흐리게
  const back=wide?[{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY(-10%) scale(.94)',opacity:0}]
    :[{transform:'translateY(0) scale(1)',filter:'brightness(1)',borderRadius:'0px'},{transform:'translateY(-12%) scale(.92)',filter:'brightness(.6)',borderRadius:'28px'}];
  const front=wide?[{transform:'translateY(16%)',opacity:0},{transform:'translateY(0)',opacity:1}]
    :[{transform:'translateY(100%)',borderRadius:'28px 28px 0 0'},{transform:'translateY(0)',borderRadius:'0px'}];
  let a1,a2;
  if(dir>0){ a1=app.animate(front,{duration:D,easing:ease}); a2=ghost.animate(back,{duration:D,easing:ease,fill:'forwards'}); }
  else { a1=ghost.animate([...front].reverse(),{duration:D,easing:ease,fill:'forwards'}); a2=app.animate([...back].reverse(),{duration:D,easing:ease}); }
  const done=()=>{ghost.remove();app.style.zIndex='';FX.busy=false;};
  Promise.all([a1.finished,a2.finished]).then(done,done);
  setTimeout(()=>{if(ghost.isConnected) done();},D+400);
}

/* 왼쪽 가장자리 스와이프 → 뒤로 */
(function(){
  let x0=null,y0=0;
  addEventListener('touchstart',e=>{const t=e.touches[0], r=$('app').getBoundingClientRect();
    x0=(t.clientX-r.left<26&&!$('back').hidden)?t.clientX:null; y0=t.clientY;},{passive:true});
  addEventListener('touchend',e=>{if(x0==null) return; const t=e.changedTouches[0];
    if(t.clientX-x0>70&&Math.abs(t.clientY-y0)<60) $('back').click(); x0=null;},{passive:true});
})();

/* 버튼 물결 */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.opt,.evopt,.evchip,.chip,.famt,.crow,.post2,.rd,.mico button');
  if(!b||b.disabled||FX.reduce) return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height)*1.2, w=document.createElement('span');
  w.className='rip'; Object.assign(w.style,{width:s+'px',height:s+'px',left:(e.clientX-r.left-s/2)+'px',top:(e.clientY-r.top-s/2)+'px'});
  if(getComputedStyle(b).position==='static') b.style.position='relative';
  b.style.overflow='hidden'; b.appendChild(w); setTimeout(()=>w.remove(),620);
},{passive:true});

/* 숫자 올라가기 */
function countUp(root){
  (root||document).querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count; if(FX.reduce||!to){el.textContent=won(to);return;}
    const t0=performance.now(), D=900;
    (function f(t){const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3); el.textContent=won(to*e); if(p<1) requestAnimationFrame(f);})(t0);
  });
}

function party(kind){
  if(FX.reduce||typeof confetti!=='function') return;
  const c=['#3182F6','#15C47E','#FFB020','#F04452','#6B7A4A'];
  if(kind==='big'){
    confetti({particleCount:90,spread:75,origin:{y:.62},colors:c,scalar:.9});
    setTimeout(()=>confetti({particleCount:50,angle:60,spread:60,origin:{x:0,y:.7},colors:c}),180);
    setTimeout(()=>confetti({particleCount:50,angle:120,spread:60,origin:{x:1,y:.7},colors:c}),300);
  } else confetti({particleCount:45,spread:60,startVelocity:32,origin:{y:.45},colors:c,scalar:.8});
}
/* 요소 순차 등장 (GSAP 있으면 스프링, 없으면 CSS .up 그대로) */
function stagger(sel,root){
  if(FX.reduce||!window.gsap) return;
  const els=(root||document).querySelectorAll(sel); if(!els.length) return;
  gsap.fromTo(els,{y:26,opacity:0,scale:.97},{y:0,opacity:1,scale:1,duration:.6,ease:'back.out(1.6)',stagger:.06,clearProps:'transform,opacity'});
}

/* 목록 페이지 넘김을 좌우 스와이프로 — data-swipe-pager="페이저 id" */
(function(){
  let sx=null,sy=0,el=null;
  addEventListener('touchstart',e=>{el=e.target.closest('[data-swipe-pager]'); if(!el) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
  addEventListener('touchend',e=>{if(!el||sx==null) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){const b=document.querySelector(`#${el.dataset.swipePager} [data-pg="${dx<0?1:-1}"]`); if(b&&!b.disabled) b.click();}
    sx=null; el=null;},{passive:true});
})();


/* ═══════════════════════════════════════════════════════════════

   이름·연락처는 명함 그리기에만 쓰이고 저장·전송되지 않는다.
   ═══════════════════════════════════════════════════════════════ */
const CARD={kind:'dis',name:'',tel:''};

/* 도전장 링크: #ch=<{f,m,w}> — 군·메뉴·관계만 담는다 */
const CH=(()=>{try{const m=location.hash.match(/ch=([^&]+)/); if(!m) return null;
  const o=JSON.parse(decodeURIComponent(m[1])); const s=v=>String(v||'').slice(0,20);
  return (o&&o.m)?{f:s(o.f),m:s(o.m),w:['선임','후임','동기'].includes(o.w)?o.w:'동기'}:null;}catch(e){return null;}})();

function resMenu(){ const R=S.res, top=R&&R.posts[0]; return top?(top.job?top.job[2]:top.title):'맞춤 공고'; }
function courseField(){ const R=S.res; return (S.ans.qnField||[])[0]||(R&&R.certs[0]&&R.certs[0].it.obligfldcd); }
function courseItems(){
  const R=S.res, field=courseField();
  return ['05','04','03'].map(sc=>(R?R.certs.map(c=>c.it):[]).find(x=>x.obligfldcd===field&&x.seriescd===sc)||QNET_ITEMS.find(x=>x.obligfldcd===field&&x.seriescd===sc))
    .filter(Boolean).slice(0,3);
}
const COURSE=[['🥗','애피타이저'],['🍖','메인'],['🍰','디저트']];

function rrect(c,x,y,w,h,r){ c.beginPath(); if(c.roundRect){c.roundRect(x,y,w,h,r);return;}
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath(); }
function cut(s,n){ s=String(s); return s.length>n?s.slice(0,n-1)+'…':s; }

/* ── 전역카드 (세로 300×420) ── */
